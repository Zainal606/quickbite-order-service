apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: quickbite
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: quickbite/order-service:1.0
          # The image is built locally and loaded into minikube, not pulled.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: order-db-secret, key: POSTGRES_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: order-db-secret, key: POSTGRES_PASSWORD}}
            - name: DB_NAME
              valueFrom: {secretKeyRef: {name: order-db-secret, key: POSTGRES_DB}}
            - name: DATABASE_URL
              value: postgresql+psycopg2://$(DB_USER):$(DB_PASSWORD)@order-db:5432/$(DB_NAME)
            # Service discovery: Kubernetes DNS name of the restaurant service.
            - name: RESTAURANT_SERVICE_URL
              value: http://restaurant-service:8001
          readinessProbe:
            httpGet: {path: /health, port: 8002}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8002}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: quickbite
  labels:
    app: order-service
spec:
  type: NodePort
  selector:
    app: order-service
  ports:
    - port: 8002
      targetPort: 8002
      nodePort: 30082
